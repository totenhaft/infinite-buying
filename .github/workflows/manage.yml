name: 관리 (시작·중지·시드·보정·계좌)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "작업"
        type: choice
        required: true
        options: [start, stop, resume, seed, div, fix, filter, status, addaccount, delaccount, chatid]
      account:
        description: "계좌 (기본: main / addaccount일 땐 새 계좌 이름)"
        required: false
        default: "main"
      ticker:
        description: "종목"
        type: choice
        required: false
        options: [TQQQ, SOXL]
      value1:
        description: "시드$(start/seed) · 수량(fix) · chat_id(addaccount/chatid) · on|off(filter)"
        required: false
        default: ""
      value2:
        description: "평단가$ (fix) · 분할수 (start, 비우면 기본값)"
        required: false
        default: ""
      version:
        description: "버전 (start 전용)"
        type: choice
        required: false
        options: ["v2.2", "v3.0"]

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 명령 적용
        run: |
          case "${{ inputs.action }}" in
            start)      CMD="start ${{ inputs.account }} ${{ inputs.ticker }} ${{ inputs.value1 }} ${{ inputs.version }} ${{ inputs.value2 }}";;
            div)        CMD="div ${{ inputs.account }} ${{ inputs.ticker }} ${{ inputs.value1 }}";;
            stop)       CMD="stop ${{ inputs.account }} ${{ inputs.ticker }}";;
            resume)     CMD="resume ${{ inputs.account }} ${{ inputs.ticker }}";;
            seed)       CMD="seed ${{ inputs.account }} ${{ inputs.ticker }} ${{ inputs.value1 }}";;
            fix)        CMD="fix ${{ inputs.account }} ${{ inputs.ticker }} ${{ inputs.value1 }} ${{ inputs.value2 }}";;
            filter)     CMD="filter ${{ inputs.account }} ${{ inputs.ticker }} ${{ inputs.value1 }}";;
            addaccount) CMD="addaccount ${{ inputs.account }} ${{ inputs.value1 }}";;
            delaccount) CMD="delaccount ${{ inputs.account }}";;
            chatid)     CMD="chatid ${{ inputs.account }} ${{ inputs.value1 }}";;
            status)     CMD="status";;
          esac
          echo "실행: $CMD"
          python bot/manage.py $CMD

      - name: 즉시 가이드 재계산 + 텔레그램 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot/daily.py

      - name: 상태 저장(커밋)
        run: |
          git config user.name "infinite-buying-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: manage ${{ inputs.action }} ${{ inputs.account }} ${{ inputs.ticker }}" || echo "변경 없음"
          # 다른 워크플로가 먼저 푸시했을 수 있으므로 재시도 (실패 시 상태 유실 방지)
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push 재시도 $i..."; sleep $((5 * i))
          done
          echo "::error::상태 저장 실패 — 다음 실행에서 재시도됩니다"; exit 1
